name: CineFlex QA
on: [push, pull_request]
permissions:
  contents: read
jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Supertest, Newman y Selenium con datos aislados
        run: npm run qa
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evidencias-qa
          path: reports/
